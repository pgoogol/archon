openapi: 3.1.0

info:
  title: finance-service API
  version: 1.0.0
  description: |
    Finanse osobiste: konta i salda, kategorie, transakcje, waluty i kursy.

    Wszystkie kwoty to liczby całkowite w jednostkach podrzędnych waluty
    (pola z sufiksem `Minor`). Liczba miejsc po przecinku zależy od waluty
    i przychodzi w polu `minorUnit` — PLN i EUR mają 2, JPY ma 0. Formatowanie
    należy do klienta; serwis nigdy nie zwraca kwoty jako liczby zmiennoprzecinkowej.

    Transakcja trzyma kurs użyty w chwili jej powstania (`fxRate`, `fxRateDate`)
    oraz gotową kwotę w walucie bazowej (`baseAmountMinor`). Dzięki temu
    zeszłoroczne podsumowanie nie zmienia się po dopisaniu nowych kursów.

servers:
  - url: /
    description: aplikacja za proxy — ścieżki niosą własny prefiks serwisu
  - url: http://localhost:8081
    description: serwis uruchomiony lokalnie

tags:
  - name: currencies
    description: Waluty i kursy wymiany
  - name: accounts
    description: Konta i salda
  - name: categories
    description: Drzewo kategorii
  - name: transactions
    description: Wydatki, przychody i transfery
  - name: imports
    description: Import wyciągów bankowych
  - name: recurring
    description: Rachunki cykliczne i terminarz płatności
  - name: reports
    description: |
      Zestawienia i raporty.

      `TRANSFER` jest wykluczony z **każdego** raportu przychodów i wydatków —
      przelew na własne konto oszczędnościowe nie jest wydatkiem, a policzony
      zawyżałby naraz obie strony.

      Kwoty zbiorcze podawane są w walucie bazowej, po kursie zapisanym na
      transakcji w chwili jej powstania. Żaden raport nie przelicza kwot
      historycznych kursem bieżącym.

paths:

  /finance/api/v1/currencies:
    get:
      tags: [currencies]
      operationId: listCurrencies
      summary: Słownik walut wraz z liczbą miejsc po przecinku
      responses:
        '200':
          description: Waluty posortowane po kodzie
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CurrencyResponse' }
    post:
      tags: [currencies]
      operationId: addCurrency
      summary: Dodanie waluty do słownika
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CurrencyRequest' }
      responses:
        '201':
          description: Waluta dodana
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrencyResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /finance/api/v1/exchange-rates:
    get:
      tags: [currencies]
      operationId: listExchangeRates
      summary: Kursy waluty w zakresie dat
      parameters:
        - name: code
          in: query
          required: true
          description: Kod waluty, np. `EUR`
          schema: { type: string, minLength: 3, maxLength: 3 }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
      responses:
        '200':
          description: Kursy rosnąco po dacie
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExchangeRateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [currencies]
      operationId: addExchangeRate
      summary: Ręczny wpis kursu
      description: >-
        Zapisany kurs dostaje źródło `MANUAL`. Ponowny wpis na tę samą datę
        nadpisuje poprzedni.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExchangeRateRequest' }
      responses:
        '201':
          description: Kurs zapisany
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExchangeRateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /finance/api/v1/exchange-rates/sync:
    post:
      tags: [currencies]
      operationId: syncExchangeRates
      summary: Pobranie kursów z NBP za zakres dat
      description: >-
        Tabela A NBP. Waluta bazowa jest pomijana — jej kurs z definicji wynosi 1.
        Dni bez publikacji (weekendy, święta) po prostu nie mają wpisu.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncExchangeRatesRequest' }
      responses:
        '200':
          description: Podsumowanie synchronizacji
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncExchangeRatesResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /finance/api/v1/accounts:
    get:
      tags: [accounts]
      operationId: listAccounts
      summary: Lista kont
      parameters:
        - { $ref: '#/components/parameters/IncludeArchived' }
      responses:
        '200':
          description: Konta posortowane po nazwie
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AccountResponse' }
    post:
      tags: [accounts]
      operationId: createAccount
      summary: Nowe konto
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountRequest' }
      responses:
        '201':
          description: Konto utworzone
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /finance/api/v1/accounts/{id}:
    put:
      tags: [accounts]
      operationId: updateAccount
      summary: Zmiana danych konta
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountRequest' }
      responses:
        '200':
          description: Konto po zmianie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [accounts]
      operationId: archiveAccount
      summary: Archiwizacja konta
      description: >-
        Konto nie znika — historia transakcji musi zostać. Zarchiwizowane konto
        przestaje się pojawiać na listach wyboru.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '204':
          description: Konto zarchiwizowane
        '404': { $ref: '#/components/responses/NotFound' }

  /finance/api/v1/accounts/{id}/balance:
    get:
      tags: [accounts]
      operationId: getAccountBalance
      summary: Saldo konta w jego walucie i w walucie bazowej
      description: >-
        Saldo liczy się zapytaniem, nie jest przechowywane. Wartość w walucie
        bazowej przelicza się kursem **bieżącym** — to stan majątku na dziś,
        w odróżnieniu od transakcji, które trzymają kurs historyczny.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Saldo konta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountBalanceResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /finance/api/v1/categories:
    get:
      tags: [categories]
      operationId: listCategories
      summary: Drzewo kategorii
      description: Zwraca korzenie; podkategorie siedzą w polu `children`.
      parameters:
        - name: direction
          in: query
          description: Ogranicza drzewo do kategorii wydatkowych albo przychodowych
          schema: { $ref: '#/components/schemas/CategoryDirection' }
        - { $ref: '#/components/parameters/IncludeArchived' }
      responses:
        '200':
          description: Kategorie najwyższego poziomu z podkategoriami
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CategoryResponse' }
    post:
      tags: [categories]
      operationId: createCategory
      summary: Nowa kategoria lub podkategoria
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryRequest' }
      responses:
        '201':
          description: Kategoria utworzona
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /finance/api/v1/categories/{id}:
    put:
      tags: [categories]
      operationId: updateCategory
      summary: Zmiana kategorii
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryRequest' }
      responses:
        '200':
          description: Kategoria po zmianie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [categories]
      operationId: archiveCategory
      summary: Archiwizacja kategorii
      description: >-
        Kategoria zostaje w bazie razem z podkategoriami — inaczej historyczne
        transakcje straciłyby przypisanie.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '204':
          description: Kategoria zarchiwizowana
        '404': { $ref: '#/components/responses/NotFound' }

  /finance/api/v1/transactions:
    get:
      tags: [transactions]
      operationId: searchTransactions
      summary: Transakcje z filtrami i stronicowaniem
      parameters:
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - name: accountId
          in: query
          description: Konto źródłowe albo docelowe transferu
          schema: { type: integer, format: int64 }
        - name: categoryId
          in: query
          schema: { type: integer, format: int64 }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/TransactionType' }
        - name: currency
          in: query
          schema: { type: string, minLength: 3, maxLength: 3 }
        - name: page
          in: query
          schema: { type: integer, format: int32, default: 0 }
        - name: size
          in: query
          description: Maksymalnie 100 — większa wartość jest przycinana
          schema: { type: integer, format: int32, default: 20 }
      responses:
        '200':
          description: Strona transakcji, najnowsze pierwsze
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionPageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [transactions]
      operationId: createTransaction
      summary: Nowa transakcja
      description: >-
        Kwota jest zawsze dodatnia — kierunek wynika z pola `type`.
        Kurs i kwota w walucie bazowej wyliczają się przy zapisie i już się
        nie zmieniają.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionRequest' }
      responses:
        '201':
          description: Transakcja zapisana
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /finance/api/v1/transactions/{id}:
    get:
      tags: [transactions]
      operationId: getTransaction
      summary: Pojedyncza transakcja
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Transakcja
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [transactions]
      operationId: updateTransaction
      summary: Zmiana transakcji
      description: >-
        Kurs jest wyznaczany od nowa dla daty księgowania po zmianie — inaczej
        przesunięcie daty zostawiłoby kwotę bazową policzoną dla starej.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionRequest' }
      responses:
        '200':
          description: Transakcja po zmianie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [transactions]
      operationId: deleteTransaction
      summary: Usunięcie transakcji
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '204':
          description: Transakcja usunięta
        '404': { $ref: '#/components/responses/NotFound' }

  /finance/api/v1/imports:
    get:
      tags: [imports]
      operationId: listImportBatches
      summary: Wgrane wyciągi, najnowsze pierwsze
      parameters:
        - name: accountId
          in: query
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Lista partii importu
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ImportBatchResponse' }
    post:
      tags: [imports]
      operationId: uploadStatement
      summary: Wgranie wyciągu i jego sparsowanie
      description: >-
        Pierwszy z dwóch kroków: plik jest liczony, parsowany i deduplikowany,
        ale ŻADNA transakcja jeszcze nie powstaje. Ten sam plik wgrany drugi raz
        jest odrzucany po skrócie SHA-256 jego zawartości, zanim ktokolwiek go
        sparsuje. Wiersze pokrywające się z już zaimportowanymi dostają status
        `DUPLICATE` i nie wejdą przy zatwierdzeniu.
      parameters:
        - name: accountId
          in: query
          required: true
          description: Konto, którego dotyczy wyciąg
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Wyciąg sparsowany, gotowy do podglądu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportBatchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /finance/api/v1/imports/{id}:
    get:
      tags: [imports]
      operationId: getImportBatch
      summary: Podgląd partii wraz z wierszami
      description: >-
        Wiersze wracają w kolejności z pliku, każdy ze statusem i sugerowaną
        kategorią. Sugestia jest zawsze do potwierdzenia — nic nie zapisuje się
        samo.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Partia z wierszami
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportBatchDetailResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /finance/api/v1/imports/{id}/commit:
    post:
      tags: [imports]
      operationId: commitImportBatch
      summary: Zatwierdzenie partii — wiersze stają się transakcjami
      description: >-
        Wszystko w jednej transakcji bazodanowej: albo powstają wszystkie
        transakcje, albo żadna. Wiersze ze statusem `DUPLICATE` są pomijane.
        Odpowiedź niesie uzgodnienie salda: rozjazd między saldem końcowym
        z wyciągu a saldem wyliczonym na `periodTo` jest pokazywany wprost
        i NIE jest poprawiany automatycznie.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommitImportRequest' }
      responses:
        '200':
          description: Partia zatwierdzona
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommitImportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /finance/api/v1/recurring-rules:
    get:
      tags: [recurring]
      operationId: listRecurringRules
      summary: Reguły cykliczne, także wyłączone
      parameters:
        - name: activeOnly
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Lista reguł
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RecurringRuleResponse' }
    post:
      tags: [recurring]
      operationId: createRecurringRule
      summary: Nowa reguła cykliczna
      description: >-
        Zapisanie reguły od razu generuje pozycje terminarza na 12 miesięcy
        w przód. Dzień miesiąca większy niż długość miesiąca przesuwa się na jego
        ostatni dzień — rachunek z 31 dnia w lutym wypada 28 albo 29.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecurringRuleRequest' }
      responses:
        '201':
          description: Reguła zapisana wraz z terminarzem
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecurringRuleResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /finance/api/v1/recurring-rules/{id}:
    get:
      tags: [recurring]
      operationId: getRecurringRule
      summary: Pojedyncza reguła
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Reguła
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecurringRuleResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [recurring]
      operationId: updateRecurringRule
      summary: Zmiana reguły
      description: >-
        Zmiana przelicza pozycje `PENDING` o terminie od dzisiaj. Pozycje `PAID`
        i `SKIPPED` zostają nietknięte — historii nie przepisujemy.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecurringRuleRequest' }
      responses:
        '200':
          description: Reguła po zmianie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecurringRuleResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [recurring]
      operationId: deactivateRecurringRule
      summary: Wyłączenie reguły
      description: >-
        Reguła przestaje generować terminarz, a jej pozycje `PENDING` o terminie
        od dzisiaj znikają. Zapłacone i pominięte zostają — to już historia.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '204':
          description: Reguła wyłączona
        '404': { $ref: '#/components/responses/NotFound' }

  /finance/api/v1/recurring-rules/generate:
    post:
      tags: [recurring]
      operationId: generateOccurrences
      summary: Ręczne uzupełnienie terminarza
      description: >-
        To samo, co robi nocny przebieg. Wywołanie jest idempotentne — drugi
        przebieg nie zmienia liczby pozycji.
      responses:
        '200':
          description: Ile pozycji dołożono
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerateOccurrencesResponse' }

  /finance/api/v1/occurrences:
    get:
      tags: [recurring]
      operationId: listOccurrences
      summary: Terminarz płatności
      description: >-
        Status `OVERDUE` nie jest przechowywany — to pozycja `PENDING` z terminem
        wcześniejszym niż dziś, wyliczana przy odczycie. Przechowywany wymagałby
        joba przepisującego statusy o północy.
      parameters:
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/OccurrenceStatus' }
        - name: ruleId
          in: query
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Pozycje terminarza, najbliższe pierwsze
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OccurrenceResponse' }

  /finance/api/v1/occurrences/{id}/pay:
    post:
      tags: [recurring]
      operationId: payOccurrence
      summary: Oznaczenie pozycji jako zapłaconej
      description: >-
        Powstaje transakcja na faktyczną kwotę i datę, a pozycja terminarza
        dostaje do niej odsyłacz. Kwota faktyczna bywa inna niż oczekiwana —
        rachunek za prąd rzadko wychodzi co do grosza tak samo.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayOccurrenceRequest' }
      responses:
        '200':
          description: Pozycja zapłacona
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OccurrenceResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /finance/api/v1/occurrences/{id}/skip:
    post:
      tags: [recurring]
      operationId: skipOccurrence
      summary: Pominięcie pozycji terminarza
      description: Żadna transakcja nie powstaje — rachunek po prostu nie przyszedł.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Pozycja pominięta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OccurrenceResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /finance/api/v1/reports/by-category:
    get:
      tags: [reports]
      operationId: reportByCategory
      summary: Wydatki w podziale na kategorie i okresy
      description: >-
        Kategoria nadrzędna zawiera sumę swoich podkategorii, a same podkategorie
        są w odpowiedzi obok niej — dzięki temu klient rozwija gałąź bez
        drugiego zapytania.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/Granularity' }
        - { $ref: '#/components/parameters/AccountIds' }
        - { $ref: '#/components/parameters/CategoryIds' }
        - name: direction
          in: query
          description: Domyślnie wydatki
          schema: { $ref: '#/components/schemas/CategoryDirection' }
      responses:
        '200':
          description: Kwoty w walucie bazowej
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ByCategoryReportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /finance/api/v1/reports/cashflow:
    get:
      tags: [reports]
      operationId: reportCashflow
      summary: Przychody, wydatki i bilans w podziale na okresy
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/Granularity' }
        - { $ref: '#/components/parameters/AccountIds' }
        - { $ref: '#/components/parameters/CategoryIds' }
      responses:
        '200':
          description: Kwoty w walucie bazowej
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashflowReportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /finance/api/v1/reports/balances:
    get:
      tags: [reports]
      operationId: reportBalances
      summary: Saldo każdego konta na koniec każdego okresu
      description: >-
        Saldo podawane jest w walucie konta. Nie przeliczamy go na walutę bazową,
        bo dla okresu zamkniętego w przeszłości nie ma jednego uczciwego kursu:
        bieżący zmieniałby historię, a historyczny nie opisuje dzisiejszego stanu
        majątku. Wartość bieżąca całości jest w `/reports/currency-exposure`.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/Granularity' }
        - { $ref: '#/components/parameters/AccountIds' }
      responses:
        '200':
          description: Salda kont po okresach
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BalancesReportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /finance/api/v1/reports/comparison:
    get:
      tags: [reports]
      operationId: reportComparison
      summary: Okres wobec poprzedniego i wobec średniej z dwunastu miesięcy
      description: >-
        Poprzedni okres to okno tej samej długości bezpośrednio przed podanym.
        Średnia liczona jest z dwunastu pełnych miesięcy poprzedzających miesiąc,
        w którym zaczyna się okres.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/AccountIds' }
        - { $ref: '#/components/parameters/CategoryIds' }
        - name: direction
          in: query
          schema: { $ref: '#/components/schemas/CategoryDirection' }
      responses:
        '200':
          description: Porównanie per kategoria
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComparisonReportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /finance/api/v1/reports/top-spend:
    get:
      tags: [reports]
      operationId: reportTopSpend
      summary: Największe pojedyncze wydatki i najczęstsi kontrahenci
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/AccountIds' }
        - { $ref: '#/components/parameters/CategoryIds' }
        - name: limit
          in: query
          description: Ile pozycji w każdym zestawieniu; domyślnie 10, najwyżej 50
          schema: { type: integer, format: int32, default: 10 }
      responses:
        '200':
          description: Dwa zestawienia w jednej odpowiedzi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopSpendReportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /finance/api/v1/reports/fixed-vs-variable:
    get:
      tags: [reports]
      operationId: reportFixedVsVariable
      summary: Udział kosztów mających pokrycie w regule cyklicznej
      description: >-
        Za koszt stały uznajemy wyłącznie wydatek **powiązany z pozycją
        terminarza** — czyli taki, który ktoś potwierdził jako płatność rachunku
        cyklicznego. Zgadywanie po kategorii dawałoby liczbę wyglądającą
        wiarygodnie i nieprawdziwą.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/Granularity' }
        - { $ref: '#/components/parameters/AccountIds' }
      responses:
        '200':
          description: Podział kosztów po okresach
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FixedVsVariableReportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /finance/api/v1/reports/upcoming:
    get:
      tags: [reports]
      operationId: reportUpcoming
      summary: Zobowiązania na najbliższe dni wraz z przeterminowanymi
      parameters:
        - { $ref: '#/components/parameters/HorizonDays' }
      responses:
        '200':
          description: Przeterminowane osobno od nadchodzących
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpcomingReportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /finance/api/v1/reports/forecast:
    get:
      tags: [reports]
      operationId: reportForecast
      summary: Prognoza salda dzień po dniu
      description: >-
        Prognoza jest jedynym raportem poza `/reports/currency-exposure`, który
        używa kursu **bieżącego** — mówi o przyszłości, a nie o historii, więc
        kurs sprzed roku nie ma tu czego opisywać. Punktem wyjścia jest dzisiejsze
        saldo, a ruchy biorą się z pozycji terminarza o statusie `PENDING`.
      parameters:
        - { $ref: '#/components/parameters/HorizonDays' }
        - { $ref: '#/components/parameters/AccountIds' }
      responses:
        '200':
          description: Saldo w walucie bazowej, po jednym punkcie na dzień
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForecastReportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /finance/api/v1/reports/yearly-matrix:
    get:
      tags: [reports]
      operationId: reportYearlyMatrix
      summary: Kategoria razy miesiąc za jeden rok, z sumami
      parameters:
        - name: year
          in: query
          required: true
          schema: { type: integer, format: int32 }
        - { $ref: '#/components/parameters/AccountIds' }
        - { $ref: '#/components/parameters/CategoryIds' }
        - name: direction
          in: query
          schema: { $ref: '#/components/schemas/CategoryDirection' }
      responses:
        '200':
          description: Macierz kwot w walucie bazowej
          content:
            application/json:
              schema: { $ref: '#/components/schemas/YearlyMatrixReportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /finance/api/v1/reports/currency-exposure:
    get:
      tags: [reports]
      operationId: reportCurrencyExposure
      summary: Salda w podziale na waluty i ich wartość bieżąca
      description: >-
        Jedyne miejsce obok prognozy, w którym świadomie używamy kursu
        **bieżącego** — raport pokazuje stan majątku na dziś, a nie historię
        operacji.
      responses:
        '200':
          description: Salda per waluta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrencyExposureReportResponse' }

  /finance/api/v1/reports/dashboard:
    get:
      tags: [reports]
      operationId: reportDashboard
      summary: Pulpit — salda, bilans miesiąca i najbliższe płatności
      responses:
        '200':
          description: Komplet danych na jeden ekran
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardResponse' }

components:

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    From:
      name: from
      in: query
      description: Początek zakresu dat, włącznie
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      description: Koniec zakresu dat, włącznie
      schema: { type: string, format: date }
    IncludeArchived:
      name: includeArchived
      in: query
      description: Domyślnie zarchiwizowane pozycje są pomijane
      schema: { type: boolean, default: false }
    ReportFrom:
      name: from
      in: query
      required: true
      description: Początek zakresu raportu, włącznie
      schema: { type: string, format: date }
    ReportTo:
      name: to
      in: query
      required: true
      description: Koniec zakresu raportu, włącznie
      schema: { type: string, format: date }
    Granularity:
      name: granularity
      in: query
      description: Podział osi czasu; domyślnie miesiąc
      schema: { $ref: '#/components/schemas/Granularity' }
    AccountIds:
      name: accountIds
      in: query
      description: Puste znaczy wszystkie konta
      schema:
        type: array
        items: { type: integer, format: int64 }
    HorizonDays:
      name: horizonDays
      in: query
      description: Ile dni w przód; domyślnie 30, najwyżej 365
      schema: { type: integer, format: int32, default: 30 }
    CategoryIds:
      name: categoryIds
      in: query
      description: >-
        Puste znaczy wszystkie kategorie. Filtr obejmuje wskazaną kategorię
        wraz z jej podkategoriami.
      schema:
        type: array
        items: { type: integer, format: int64 }

  responses:
    BadRequest:
      description: Błąd walidacji
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Zasób nie istnieje
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Konflikt z istniejącym stanem
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BadGateway:
      description: Zewnętrzne API niedostępne
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:

    ErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
          description: |
            Kod maszynowy — po nim klient rozpoznaje przypadek, nie po treści.

            Przykłady:
            * `CURRENCY_MISMATCH` — waluta transakcji nie zgadza się z walutą konta
            * `TRANSFER_WITHOUT_TARGET` — transfer bez konta docelowego
            * `EXCHANGE_RATE_NOT_FOUND` — brak kursu na dzień księgowania

            Pełna lista kodów: `com.pgoogol.finance.common.ErrorCodes`.
          example: CURRENCY_MISMATCH
        message: { type: string }
        timestamp: { type: string, format: date-time }
        traceId: { type: [string, 'null'] }
      required: [errorCode, message, timestamp]

    AccountType:
      type: string
      enum: [BANK, CASH, CARD]

    CategoryDirection:
      type: string
      enum: [EXPENSE, INCOME]

    TransactionType:
      type: string
      enum: [EXPENSE, INCOME, TRANSFER]

    RateSource:
      type: string
      enum: [NBP, MANUAL]

    CurrencyResponse:
      type: object
      description: Waluta słownikowa; `minorUnit` decyduje o formatowaniu kwot.
      properties:
        code: { type: string, examples: [PLN] }
        name: { type: string }
        minorUnit:
          type: integer
          format: int32
          description: Liczba miejsc po przecinku — PLN 2, JPY 0, TND 3
      required: [code, name, minorUnit]

    CurrencyRequest:
      type: object
      properties:
        code: { type: string, minLength: 3, maxLength: 3 }
        name: { type: string, maxLength: 50 }
        minorUnit: { type: integer, format: int32, minimum: 0, maximum: 4 }
      required: [code, name, minorUnit]

    ExchangeRateResponse:
      type: object
      properties:
        code: { type: string }
        rateDate: { type: string, format: date }
        rate:
          type: string
          description: Ile waluty bazowej za jednostkę tej waluty; dziesiętnie, jako tekst
          examples: ['4.32150000']
        source: { $ref: '#/components/schemas/RateSource' }
      required: [code, rateDate, rate, source]

    ExchangeRateRequest:
      type: object
      properties:
        code: { type: string, minLength: 3, maxLength: 3 }
        rateDate: { type: string, format: date }
        rate: { type: string, examples: ['4.32150000'] }
      required: [code, rateDate, rate]

    SyncExchangeRatesRequest:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        codes:
          type: array
          description: Puste = wszystkie waluty ze słownika poza bazową
          items: { type: string, minLength: 3, maxLength: 3 }
      required: [from, to]

    SyncExchangeRatesResponse:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        savedCount:
          type: integer
          format: int32
          description: Liczba zapisanych kursów; dni bez publikacji NBP nie mają wpisu
        codes:
          type: array
          items: { type: string }
      required: [from, to, savedCount, codes]

    AccountRequest:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        type: { $ref: '#/components/schemas/AccountType' }
        currency: { type: string, minLength: 3, maxLength: 3 }
        iban: { type: [string, 'null'], maxLength: 34 }
        openingBalanceMinor:
          type: integer
          format: int64
          description: Saldo otwarcia w jednostkach podrzędnych waluty konta
        openingBalanceOn: { type: string, format: date }
      required: [name, type, currency, openingBalanceMinor, openingBalanceOn]

    AccountResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        type: { $ref: '#/components/schemas/AccountType' }
        currency:
          type: string
          description: Skalę tej waluty klient bierze ze słownika `/currencies`
        iban: { type: [string, 'null'] }
        openingBalanceMinor: { type: integer, format: int64 }
        openingBalanceOn: { type: string, format: date }
        archived: { type: boolean }
      required: [id, name, type, currency, openingBalanceMinor, openingBalanceOn, archived]

    AccountBalanceResponse:
      type: object
      properties:
        accountId: { type: integer, format: int64 }
        currency: { type: string }
        minorUnit: { type: integer, format: int32 }
        balanceMinor:
          type: integer
          format: int64
          description: Saldo w walucie konta; ujemne jest dopuszczalne
        baseCurrency: { type: string }
        baseBalanceMinor:
          type: integer
          format: int64
          description: Saldo przeliczone kursem bieżącym na walutę bazową
        fxRate: { type: string }
        fxRateDate: { type: string, format: date }
      required: [accountId, currency, minorUnit, balanceMinor, baseCurrency, baseBalanceMinor, fxRate, fxRateDate]

    CategoryRequest:
      type: object
      properties:
        parentId: { type: [integer, 'null'], format: int64 }
        name: { type: string, maxLength: 100 }
        direction: { $ref: '#/components/schemas/CategoryDirection' }
      required: [name, direction]

    CategoryResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        parentId: { type: [integer, 'null'], format: int64 }
        name: { type: string }
        direction: { $ref: '#/components/schemas/CategoryDirection' }
        archived: { type: boolean }
        children:
          type: array
          items: { $ref: '#/components/schemas/CategoryResponse' }
      required: [id, name, direction, archived, children]

    TransactionRequest:
      type: object
      description: >-
        `TRANSFER` wymaga `toAccountId` i nie przyjmuje `categoryId`;
        `EXPENSE` i `INCOME` odwrotnie. `toAmountMinor` jest wymagane, gdy konta
        transferu mają różne waluty.
      properties:
        type: { $ref: '#/components/schemas/TransactionType' }
        bookedOn: { type: string, format: date }
        amountMinor:
          type: integer
          format: int64
          minimum: 1
          description: Zawsze dodatnia — kierunek wynika z `type`
        currency: { type: string, minLength: 3, maxLength: 3 }
        originalAmountMinor: { type: [integer, 'null'], format: int64 }
        originalCurrency: { type: [string, 'null'], minLength: 3, maxLength: 3 }
        accountId: { type: integer, format: int64 }
        toAccountId: { type: [integer, 'null'], format: int64 }
        toAmountMinor: { type: [integer, 'null'], format: int64 }
        categoryId: { type: [integer, 'null'], format: int64 }
        description: { type: [string, 'null'], maxLength: 255 }
        counterparty: { type: [string, 'null'], maxLength: 255 }
      required: [type, bookedOn, amountMinor, currency, accountId]

    TransactionResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        type: { $ref: '#/components/schemas/TransactionType' }
        bookedOn: { type: string, format: date }
        amountMinor: { type: integer, format: int64 }
        currency: { type: string }
        baseAmountMinor: { type: integer, format: int64 }
        baseCurrency: { type: string }
        fxRate: { type: string }
        fxRateDate:
          type: string
          format: date
          description: >-
            Data faktycznie użytego kursu — bywa wcześniejsza niż `bookedOn`,
            bo NBP nie publikuje tabel w weekendy i święta
        originalAmountMinor: { type: [integer, 'null'], format: int64 }
        originalCurrency: { type: [string, 'null'] }
        accountId: { type: integer, format: int64 }
        accountName: { type: string }
        toAccountId: { type: [integer, 'null'], format: int64 }
        toAccountName: { type: [string, 'null'] }
        toAmountMinor: { type: [integer, 'null'], format: int64 }
        categoryId: { type: [integer, 'null'], format: int64 }
        categoryName: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        counterparty: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
      required:
        - id
        - type
        - bookedOn
        - amountMinor
        - currency
        - baseAmountMinor
        - baseCurrency
        - fxRate
        - fxRateDate
        - accountId
        - accountName
        - createdAt

    TransactionPageResponse:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/TransactionResponse' }
        page: { type: integer, format: int32 }
        size: { type: integer, format: int32 }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer, format: int32 }
      required: [content, page, size, totalElements, totalPages]

    RecurringFrequency:
      type: string
      enum: [MONTHLY, QUARTERLY, YEARLY]
      description: >-
        Częstotliwość liczona od `startsOn`. Wszystkie warianty kotwiczą się
        na dniu miesiąca, więc `dayOfMonth` obowiązuje w każdym z nich.

    OccurrenceStatus:
      type: string
      enum: [PENDING, PAID, SKIPPED, OVERDUE]
      description: |
        * `PENDING` — czeka na termin
        * `PAID` — zapłacona, ma swoją transakcję
        * `SKIPPED` — świadomie pominięta, bez transakcji
        * `OVERDUE` — **nie jest przechowywany**: to `PENDING` z terminem
          wcześniejszym niż dziś, wyliczany przy odczycie

    RecurringRuleRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        accountId: { type: integer, format: int64 }
        categoryId: { type: integer, format: int64 }
        type: { $ref: '#/components/schemas/TransactionType' }
        amountMinor:
          type: integer
          format: int64
          minimum: 1
          description: Kwota oczekiwana; faktyczna podawana jest przy płatności
        frequency: { $ref: '#/components/schemas/RecurringFrequency' }
        dayOfMonth:
          type: integer
          format: int32
          minimum: 1
          maximum: 31
          description: >-
            Dzień większy niż długość miesiąca przesuwa się na jego ostatni dzień
        startsOn: { type: string, format: date }
        endsOn: { type: [string, 'null'], format: date }
        matchPattern:
          type: [string, 'null']
          maxLength: 255
          description: Fragment opisu, po którym import rozpoznaje tę płatność
      required: [name, accountId, categoryId, type, amountMinor, frequency, dayOfMonth, startsOn]

    RecurringRuleResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        accountId: { type: integer, format: int64 }
        accountName: { type: string }
        categoryId: { type: integer, format: int64 }
        categoryName: { type: string }
        type: { $ref: '#/components/schemas/TransactionType' }
        amountMinor: { type: integer, format: int64 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        frequency: { $ref: '#/components/schemas/RecurringFrequency' }
        dayOfMonth: { type: integer, format: int32 }
        startsOn: { type: string, format: date }
        endsOn: { type: [string, 'null'], format: date }
        matchPattern: { type: [string, 'null'] }
        active: { type: boolean }
      required:
        - id
        - name
        - accountId
        - accountName
        - categoryId
        - categoryName
        - type
        - amountMinor
        - currency
        - frequency
        - dayOfMonth
        - startsOn
        - active

    OccurrenceResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        ruleId: { type: integer, format: int64 }
        ruleName: { type: string }
        accountId: { type: integer, format: int64 }
        categoryId: { type: integer, format: int64 }
        dueDate: { type: string, format: date }
        expectedAmountMinor: { type: integer, format: int64 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        status: { $ref: '#/components/schemas/OccurrenceStatus' }
        paidOn: { type: [string, 'null'], format: date }
        paidAmountMinor: { type: [integer, 'null'], format: int64 }
        transactionId: { type: [integer, 'null'], format: int64 }
      required:
        - id
        - ruleId
        - ruleName
        - accountId
        - categoryId
        - dueDate
        - expectedAmountMinor
        - currency
        - status

    PayOccurrenceRequest:
      type: object
      properties:
        paidOn: { type: string, format: date }
        paidAmountMinor:
          type: integer
          format: int64
          minimum: 1
          description: Kwota faktyczna; bywa inna niż oczekiwana
        accountId:
          type: [integer, 'null']
          format: int64
          description: Konto obciążone, gdy inne niż z reguły
      required: [paidOn, paidAmountMinor]

    GenerateOccurrencesResponse:
      type: object
      properties:
        createdCount:
          type: integer
          format: int32
          description: Ile pozycji dołożono; drugi przebieg daje zero
        horizonTo:
          type: string
          format: date
          description: Do kiedy sięga wygenerowany terminarz
      required: [createdCount, horizonTo]

    ImportBatchStatus:
      type: string
      enum: [PARSED, COMMITTED]
      description: |
        * `PARSED` — plik sparsowany, żadna transakcja jeszcze nie powstała
        * `COMMITTED` — wiersze zamienione na transakcje

    ImportRowStatus:
      type: string
      enum: [NEW, DUPLICATE, COMMITTED]
      description: |
        * `NEW` — wiersz wejdzie przy zatwierdzeniu
        * `DUPLICATE` — ta sama operacja jest już w bazie; wiersz zostanie pominięty
        * `COMMITTED` — wiersz ma już swoją transakcję

    ImportBatchResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        accountId: { type: integer, format: int64 }
        accountName: { type: string }
        fileName: { type: string }
        status: { $ref: '#/components/schemas/ImportBatchStatus' }
        periodFrom: { type: [string, 'null'], format: date }
        periodTo: { type: [string, 'null'], format: date }
        openingBalanceMinor: { type: [integer, 'null'], format: int64 }
        closingBalanceMinor: { type: [integer, 'null'], format: int64 }
        rowCount: { type: integer, format: int32 }
        newCount:
          type: integer
          format: int32
          description: Wiersze, które wejdą przy zatwierdzeniu
        duplicateCount:
          type: integer
          format: int32
          description: Wiersze rozpoznane jako już zaimportowane
        uploadedAt: { type: string, format: date-time }
        committedAt: { type: [string, 'null'], format: date-time }
      required:
        - id
        - accountId
        - accountName
        - fileName
        - status
        - rowCount
        - newCount
        - duplicateCount
        - uploadedAt

    ImportRowResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        ordinal:
          type: integer
          format: int32
          description: Pozycja wiersza w pliku, liczona od zera
        bookedOn: { type: string, format: date }
        amountMinor:
          type: integer
          format: int64
          description: >-
            Kwota ZE ZNAKIEM, dokładnie jak na wyciągu. Znak zamienia się
            na typ transakcji dopiero przy zatwierdzeniu.
        currency: { type: string, minLength: 3, maxLength: 3 }
        originalAmountMinor: { type: [integer, 'null'], format: int64 }
        originalCurrency: { type: [string, 'null'], minLength: 3, maxLength: 3 }
        description: { type: [string, 'null'] }
        counterparty: { type: [string, 'null'] }
        bankReference: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ImportRowStatus' }
        suggestedCategoryId: { type: [integer, 'null'], format: int64 }
        suggestedCategoryName: { type: [string, 'null'] }
        transactionId: { type: [integer, 'null'], format: int64 }
      required: [id, ordinal, bookedOn, amountMinor, currency, status]

    ImportBatchDetailResponse:
      type: object
      properties:
        batch: { $ref: '#/components/schemas/ImportBatchResponse' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/ImportRowResponse' }
      required: [batch, rows]

    CommitImportRequest:
      type: object
      properties:
        categoryAssignments:
          type: array
          description: >-
            Kategoria dla wierszy, które jej wymagają. Wpływ i wydatek muszą
            mieć kategorię — wiersz bez niej wywala zatwierdzenie całej partii.
          items: { $ref: '#/components/schemas/ImportCategoryAssignment' }
      required: [categoryAssignments]

    ImportCategoryAssignment:
      type: object
      properties:
        rowId: { type: integer, format: int64 }
        categoryId: { type: integer, format: int64 }
      required: [rowId, categoryId]

    CommitImportResponse:
      type: object
      properties:
        batchId: { type: integer, format: int64 }
        committedCount: { type: integer, format: int32 }
        skippedDuplicateCount: { type: integer, format: int32 }
        reconciliation: { $ref: '#/components/schemas/ReconciliationResponse' }
      required: [batchId, committedCount, skippedDuplicateCount, reconciliation]

    ReconciliationResponse:
      type: object
      description: >-
        Porównanie salda końcowego z wyciągu z saldem wyliczonym na `periodTo`.
        Rozjazd jest pokazywany, nigdy poprawiany automatycznie.
      properties:
        statementClosingBalanceMinor: { type: [integer, 'null'], format: int64 }
        computedBalanceMinor: { type: [integer, 'null'], format: int64 }
        differenceMinor: { type: [integer, 'null'], format: int64 }
        matched:
          type: boolean
          description: Fałsz także wtedy, gdy wyciąg nie podał salda końcowego
      required: [matched]

    Granularity:
      type: string
      enum: [DAY, MONTH, YEAR]
      default: MONTH
      description: Podział osi czasu raportu

    ByCategoryReportResponse:
      type: object
      properties:
        baseCurrency: { type: string, minLength: 3, maxLength: 3 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/ByCategoryRow' }
        totals:
          type: array
          items: { $ref: '#/components/schemas/PeriodTotal' }
      required: [baseCurrency, rows, totals]

    ByCategoryRow:
      type: object
      properties:
        period:
          type: string
          format: date
          description: Pierwszy dzień okresu
        categoryId: { type: integer, format: int64 }
        categoryName: { type: string }
        parentCategoryId: { type: [integer, 'null'], format: int64 }
        amountMinor:
          type: integer
          format: int64
          description: >-
            Suma w walucie bazowej wraz z podkategoriami tej kategorii
        ownAmountMinor:
          type: integer
          format: int64
          description: Kwota zapisana wprost na tej kategorii, bez podkategorii
        transactionCount: { type: integer, format: int32 }
      required:
        - period
        - categoryId
        - categoryName
        - amountMinor
        - ownAmountMinor
        - transactionCount

    PeriodTotal:
      type: object
      properties:
        period: { type: string, format: date }
        amountMinor: { type: integer, format: int64 }
      required: [period, amountMinor]

    CashflowReportResponse:
      type: object
      properties:
        baseCurrency: { type: string, minLength: 3, maxLength: 3 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/CashflowRow' }
      required: [baseCurrency, rows]

    CashflowRow:
      type: object
      properties:
        period: { type: string, format: date }
        incomeMinor: { type: integer, format: int64 }
        expenseMinor: { type: integer, format: int64 }
        netMinor:
          type: integer
          format: int64
          description: Przychody minus wydatki; bywa ujemny
      required: [period, incomeMinor, expenseMinor, netMinor]

    BalancesReportResponse:
      type: object
      properties:
        rows:
          type: array
          items: { $ref: '#/components/schemas/AccountBalanceRow' }
      required: [rows]

    AccountBalanceRow:
      type: object
      properties:
        period: { type: string, format: date }
        accountId: { type: integer, format: int64 }
        accountName: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
        balanceMinor:
          type: integer
          format: int64
          description: Saldo na ostatni dzień okresu, w walucie konta
      required: [period, accountId, accountName, currency, balanceMinor]

    ComparisonReportResponse:
      type: object
      properties:
        baseCurrency: { type: string, minLength: 3, maxLength: 3 }
        previousFrom: { type: string, format: date }
        previousTo: { type: string, format: date }
        rows:
          type: array
          items: { $ref: '#/components/schemas/CategoryComparisonRow' }
      required: [baseCurrency, previousFrom, previousTo, rows]

    CategoryComparisonRow:
      type: object
      properties:
        categoryId: { type: integer, format: int64 }
        categoryName: { type: string }
        currentMinor: { type: integer, format: int64 }
        previousMinor: { type: integer, format: int64 }
        monthlyAverageMinor:
          type: integer
          format: int64
          description: Średnia miesięczna z dwunastu miesięcy przed okresem
        changePercent:
          type: [string, 'null']
          description: >-
            Zmiana wobec poprzedniego okresu. `null`, gdy poprzedni okres był
            zerowy — dzielenie przez zero nie jest wzrostem o nieskończoność
      required: [categoryId, categoryName, currentMinor, previousMinor, monthlyAverageMinor]

    TopSpendReportResponse:
      type: object
      properties:
        baseCurrency: { type: string, minLength: 3, maxLength: 3 }
        transactions:
          type: array
          items: { $ref: '#/components/schemas/TopExpenseRow' }
        counterparties:
          type: array
          items: { $ref: '#/components/schemas/TopCounterpartyRow' }
      required: [baseCurrency, transactions, counterparties]

    TopExpenseRow:
      type: object
      properties:
        transactionId: { type: integer, format: int64 }
        bookedOn: { type: string, format: date }
        amountMinor: { type: integer, format: int64 }
        description: { type: [string, 'null'] }
        counterparty: { type: [string, 'null'] }
        categoryName: { type: [string, 'null'] }
        accountName: { type: string }
      required: [transactionId, bookedOn, amountMinor, accountName]

    TopCounterpartyRow:
      type: object
      properties:
        counterparty: { type: string }
        amountMinor: { type: integer, format: int64 }
        transactionCount: { type: integer, format: int32 }
      required: [counterparty, amountMinor, transactionCount]

    FixedVsVariableReportResponse:
      type: object
      properties:
        baseCurrency: { type: string, minLength: 3, maxLength: 3 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/FixedVsVariableRow' }
      required: [baseCurrency, rows]

    FixedVsVariableRow:
      type: object
      properties:
        period: { type: string, format: date }
        fixedMinor: { type: integer, format: int64 }
        variableMinor: { type: integer, format: int64 }
        fixedSharePercent:
          type: [string, 'null']
          description: '`null`, gdy w okresie nie było żadnego wydatku'
      required: [period, fixedMinor, variableMinor]

    UpcomingReportResponse:
      type: object
      properties:
        horizonTo: { type: string, format: date }
        overdue:
          type: array
          items: { $ref: '#/components/schemas/UpcomingItem' }
        upcoming:
          type: array
          items: { $ref: '#/components/schemas/UpcomingItem' }
      required: [horizonTo, overdue, upcoming]

    UpcomingItem:
      type: object
      properties:
        occurrenceId: { type: integer, format: int64 }
        ruleId: { type: integer, format: int64 }
        ruleName: { type: string }
        accountId: { type: integer, format: int64 }
        accountName: { type: string }
        dueDate: { type: string, format: date }
        expectedAmountMinor: { type: integer, format: int64 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        overdue: { type: boolean }
      required:
        - occurrenceId
        - ruleId
        - ruleName
        - accountId
        - accountName
        - dueDate
        - expectedAmountMinor
        - currency
        - overdue

    ForecastReportResponse:
      type: object
      properties:
        baseCurrency: { type: string, minLength: 3, maxLength: 3 }
        startingBalanceMinor: { type: integer, format: int64 }
        points:
          type: array
          items: { $ref: '#/components/schemas/ForecastPoint' }
      required: [baseCurrency, startingBalanceMinor, points]

    ForecastPoint:
      type: object
      properties:
        date: { type: string, format: date }
        balanceMinor: { type: integer, format: int64 }
        changeMinor:
          type: integer
          format: int64
          description: Ruch tego dnia; zero, gdy nic nie wypada
      required: [date, balanceMinor, changeMinor]

    YearlyMatrixReportResponse:
      type: object
      properties:
        baseCurrency: { type: string, minLength: 3, maxLength: 3 }
        year: { type: integer, format: int32 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/YearlyMatrixRow' }
        monthlyTotalsMinor:
          type: array
          description: Dwanaście sum, od stycznia do grudnia
          items: { type: integer, format: int64 }
        totalMinor: { type: integer, format: int64 }
      required: [baseCurrency, year, rows, monthlyTotalsMinor, totalMinor]

    YearlyMatrixRow:
      type: object
      properties:
        categoryId: { type: integer, format: int64 }
        categoryName: { type: string }
        monthsMinor:
          type: array
          description: Dwanaście kwot, od stycznia do grudnia
          items: { type: integer, format: int64 }
        totalMinor: { type: integer, format: int64 }
      required: [categoryId, categoryName, monthsMinor, totalMinor]

    CurrencyExposureReportResponse:
      type: object
      properties:
        baseCurrency: { type: string, minLength: 3, maxLength: 3 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/CurrencyExposureRow' }
        totalBaseMinor: { type: integer, format: int64 }
      required: [baseCurrency, rows, totalBaseMinor]

    CurrencyExposureRow:
      type: object
      properties:
        currency: { type: string, minLength: 3, maxLength: 3 }
        minorUnit: { type: integer, format: int32 }
        balanceMinor: { type: integer, format: int64 }
        baseValueMinor:
          type: [integer, 'null']
          format: int64
          description: '`null`, gdy waluta nie ma jeszcze żadnego kursu'
        rate: { type: [string, 'null'] }
        rateDate: { type: [string, 'null'], format: date }
      required: [currency, minorUnit, balanceMinor]

    DashboardResponse:
      type: object
      properties:
        baseCurrency: { type: string, minLength: 3, maxLength: 3 }
        month: { type: string, format: date }
        accountBalances:
          type: array
          items: { $ref: '#/components/schemas/AccountValuation' }
        monthIncomeMinor: { type: integer, format: int64 }
        monthExpenseMinor: { type: integer, format: int64 }
        monthNetMinor: { type: integer, format: int64 }
        overdue:
          type: array
          items: { $ref: '#/components/schemas/UpcomingItem' }
        upcoming:
          type: array
          items: { $ref: '#/components/schemas/UpcomingItem' }
      required:
        - baseCurrency
        - month
        - accountBalances
        - monthIncomeMinor
        - monthExpenseMinor
        - monthNetMinor
        - overdue
        - upcoming

    AccountValuation:
      type: object
      description: >-
        Saldo konta na pulpicie. Wycena bazowa bywa pusta — konto w walucie bez
        pobranego kursu ma pokazać saldo, a nie wywrócić cały ekran.
      properties:
        accountId: { type: integer, format: int64 }
        accountName: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
        minorUnit: { type: integer, format: int32 }
        balanceMinor: { type: integer, format: int64 }
        baseValueMinor: { type: [integer, 'null'], format: int64 }
      required: [accountId, accountName, currency, minorUnit, balanceMinor]
