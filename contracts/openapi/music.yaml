openapi: 3.1.0

# Kontrakt API music-service. Pisany ręcznie i to on jest źródłem prawdy:
# zmiana idzie tutaj PRZED implementacją, a test kontraktowy w serwisie
# porównuje specyfikację wygenerowaną z kodu z tym plikiem i wywala build
# przy rozjeździe (.claude/rules/backend-api.md).
#
# Typy DTO frontu są generowane z tego pliku i nigdy nie są pisane ręcznie.

info:
  title: music-view API
  version: 1.0.0
  description: |
    Narzędzie DJ-a do zarządzania biblioteką muzyczną. Rozdział danych (D3):
    `track_catalog` trzyma fakty o utworze, `library_entry` prywatne dane DJ-a.

servers:
  - url: /
    description: aplikacja za proxy /api

tags:
  - name: catalog
    description: Katalog utworów i wyszukiwarka
  - name: library
    description: Biblioteka DJ-a i przegląd
  - name: playlists
    description: Playlisty i sety
  - name: sets
    description: Generowanie i uzupełnianie setów
  - name: enrich
    description: Zlecenia wzbogacania
  - name: ingest
    description: Import z pliku i ze Spotify
  - name: auth
    description: Połączenie konta Spotify

paths:

  /api/catalog/tracks:
    get:
      tags: [catalog]
      operationId: searchTracks
      summary: Wyszukiwarka katalogu z filtrami, sortowaniem i stronicowaniem
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: genreFamily, in: query, schema: { $ref: '#/components/schemas/GenreFamily' } }
        - { name: yearMin, in: query, schema: { type: integer, format: int32 } }
        - { name: yearMax, in: query, schema: { type: integer, format: int32 } }
        - { name: durationMinSec, in: query, schema: { type: integer, format: int32 } }
        - { name: durationMaxSec, in: query, schema: { type: integer, format: int32 } }
        - { name: popularityMin, in: query, schema: { type: integer, format: int32 } }
        - { name: explicit, in: query, schema: { type: boolean } }
        - { name: bpmMin, in: query, schema: { type: integer, format: int32 } }
        - { name: bpmMax, in: query, schema: { type: integer, format: int32 } }
        - { name: tempoClass, in: query, schema: { $ref: '#/components/schemas/TempoClass' } }
        - { name: energy, in: query, schema: { type: string } }
        - name: camelot
          in: query
          description: Pozycja koła Camelot, np. `8A` (D25)
          schema: { type: string }
        - name: camelotCompatible
          in: query
          description: Rozszerza filtr o tonacje zgodne (±1 i równoległa)
          schema: { type: boolean, default: true }
        - { name: inLibrary, in: query, schema: { type: boolean } }
        - { name: ratingMin, in: query, schema: { type: integer, format: int32 } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: valenceMin, in: query, schema: { type: number } }
        - { name: valenceMax, in: query, schema: { type: number } }
        - { name: instrumentalMin, in: query, schema: { type: number } }
        - { name: livenessMax, in: query, schema: { type: number } }
        - { name: bpmSource, in: query, schema: { $ref: '#/components/schemas/BpmSource' } }
        - { name: missing, in: query, schema: { $ref: '#/components/schemas/MissingGroup' } }
        - { name: sort, in: query, schema: { $ref: '#/components/schemas/CatalogSort' } }
        - { name: direction, in: query, schema: { $ref: '#/components/schemas/SortDirection' } }
        - { name: page, in: query, schema: { type: integer, format: int32, default: 0 } }
        - { name: size, in: query, schema: { type: integer, format: int32, default: 20 } }
      responses:
        '200':
          description: Strona wyniku
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageCatalogRowResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/catalog/tracks/{spotifyId}:
    get:
      tags: [catalog]
      operationId: getTrack
      summary: Pojedynczy utwór z katalogu
      parameters: [{ $ref: '#/components/parameters/SpotifyId' }]
      responses:
        '200':
          description: Utwór
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/catalog/tracks/{spotifyId}/metrics:
    get:
      tags: [catalog]
      operationId: getTrackMetrics
      summary: Metryki wgrane z pliku (D24)
      parameters: [{ $ref: '#/components/parameters/SpotifyId' }]
      responses:
        '200':
          description: Metryki utworu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackMetricsResponse' }
        '404':
          description: Utwór nie dostał metryk

  /api/catalog/metrics-coverage:
    get:
      tags: [catalog]
      operationId: getMetricsCoverage
      summary: Ile utworów katalogu ma metryki z pliku
      responses:
        '200':
          description: Pokrycie metrykami
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsCoverageResponse' }

  /api/library/tracks:
    get:
      tags: [library]
      operationId: listLibraryTracks
      summary: Strona wpisów bibliotecznych
      parameters:
        - { name: page, in: query, schema: { type: integer, format: int32, default: 0 } }
        - { name: size, in: query, schema: { type: integer, format: int32, default: 20 } }
      responses:
        '200':
          description: Strona wpisów
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageLibraryEntryResponse' }
    post:
      tags: [library]
      operationId: addLibraryTrack
      summary: Ręczne dodanie utworu do biblioteki
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddLibraryTrackRequest' }
      responses:
        '201':
          description: Wpis utworzony
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryEntryResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/library/tracks/{spotifyId}:
    get:
      tags: [library]
      operationId: getLibraryTrack
      parameters: [{ $ref: '#/components/parameters/SpotifyId' }]
      responses:
        '200':
          description: Wpis biblioteczny
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryEntryResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [library]
      operationId: updateLibraryTrack
      summary: Zmiana danych prywatnych DJ-a
      description: |
        Pole pominięte zostaje bez zmian; pusta wartość czyści pole.
        `version` jest wymagana (D29) — nieświeża kończy się 409.
      parameters: [{ $ref: '#/components/parameters/SpotifyId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateLibraryEntryRequest' }
      responses:
        '200':
          description: Wpis po zmianie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryEntryResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [library]
      operationId: deleteLibraryTrack
      summary: Usunięcie wpisu; katalog zostaje bez zmian
      parameters: [{ $ref: '#/components/parameters/SpotifyId' }]
      responses:
        '204': { description: Usunięto }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/library/overview:
    get:
      tags: [library]
      operationId: getLibraryOverview
      summary: Przegląd biblioteki — rozkłady liczone w bazie (D27)
      responses:
        '200':
          description: Przegląd
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryOverviewResponse' }

  /api/library/tags:
    get:
      tags: [library]
      operationId: listLibraryTags
      summary: Tagi użyte w bibliotece
      responses:
        '200':
          description: Lista tagów
          content:
            application/json:
              schema:
                type: array
                items: { type: string }

  /api/playlists:
    get:
      tags: [playlists]
      operationId: listPlaylists
      responses:
        '200':
          description: Lista playlist
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PlaylistSummaryResponse' }
    post:
      tags: [playlists]
      operationId: createPlaylist
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavePlaylistRequest' }
      responses:
        '201':
          description: Playlista utworzona
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaylistSummaryResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/playlists/{id}:
    get:
      tags: [playlists]
      operationId: getPlaylist
      parameters: [{ $ref: '#/components/parameters/PlaylistId' }]
      responses:
        '200':
          description: Playlista ze składem
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaylistResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [playlists]
      operationId: renamePlaylist
      parameters: [{ $ref: '#/components/parameters/PlaylistId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavePlaylistRequest' }
      responses:
        '200':
          description: Playlista po zmianie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaylistSummaryResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [playlists]
      operationId: deletePlaylist
      parameters: [{ $ref: '#/components/parameters/PlaylistId' }]
      responses:
        '204': { description: Usunięto }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/playlists/{id}/tracks:
    post:
      tags: [playlists]
      operationId: addPlaylistTrack
      summary: Dokłada utwór na koniec setu
      parameters: [{ $ref: '#/components/parameters/PlaylistId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddPlaylistTrackRequest' }
      responses:
        '200':
          description: Playlista po zmianie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaylistResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    put:
      tags: [playlists]
      operationId: reorderPlaylist
      summary: Nowa kolejność — musi być permutacją obecnego składu
      parameters: [{ $ref: '#/components/parameters/PlaylistId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReorderPlaylistRequest' }
      responses:
        '200':
          description: Playlista po zmianie kolejności
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaylistResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/playlists/{id}/tracks/{spotifyId}:
    delete:
      tags: [playlists]
      operationId: removePlaylistTrack
      summary: Usuwa utwór i zwiera pozycje pozostałych
      parameters:
        - { $ref: '#/components/parameters/PlaylistId' }
        - { $ref: '#/components/parameters/SpotifyId' }
      responses:
        '200':
          description: Playlista po zmianie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaylistResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/playlists/{id}/export-to-spotify:
    post:
      tags: [playlists]
      operationId: exportPlaylistToSpotify
      summary: Pierwszy eksport zakłada playlistę, kolejny nadpisuje tę samą
      parameters: [{ $ref: '#/components/parameters/PlaylistId' }]
      responses:
        '200':
          description: Wynik eksportu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaylistExportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/sets/propose:
    post:
      tags: [sets]
      operationId: proposeSet
      summary: Propozycja setu z puli kandydatów; nic nie zapisuje
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetProposalRequest' }
      responses:
        '200':
          description: Propozycja
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetProposalResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/sets/{playlistId}/fill:
    post:
      tags: [sets]
      operationId: fillSet
      summary: Uzupełnia gotowy set do zadanego czasu
      parameters: [{ $ref: '#/components/parameters/PlaylistIdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetFillRequest' }
      responses:
        '200':
          description: Dalszy ciąg setu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetFillResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/sets/{playlistId}/suggest:
    post:
      tags: [sets]
      operationId: suggestForSet
      summary: Dobiera kandydatów na wskazane miejsce w secie
      parameters: [{ $ref: '#/components/parameters/PlaylistIdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetSuggestionRequest' }
      responses:
        '200':
          description: Propozycje
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetSuggestionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/enrich:
    post:
      tags: [enrich]
      operationId: startEnrichment
      summary: Startuje job wzbogacania (asynchronicznie)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrichRequest' }
      responses:
        '202':
          description: Job wystartował
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionIdResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/enrich/estimate:
    post:
      tags: [enrich]
      operationId: estimateEnrichment
      summary: Ile utworów obejmie zlecenie i ile to będzie kosztowało
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrichRequest' }
      responses:
        '200':
          description: Szacunek
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrichmentEstimateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/enrich/jobs:
    get:
      tags: [enrich]
      operationId: listEnrichJobs
      parameters:
        - { name: limit, in: query, schema: { type: integer, format: int32, default: 20 } }
      responses:
        '200':
          description: Historia wykonań
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EnrichJobResponse' }

  /api/enrich/jobs/{executionId}:
    get:
      tags: [enrich]
      operationId: getEnrichJob
      parameters: [{ $ref: '#/components/parameters/ExecutionId' }]
      responses:
        '200':
          description: Status wykonania
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrichJobResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/enrich/jobs/{executionId}/failures:
    get:
      tags: [enrich]
      operationId: getEnrichJobFailures
      summary: Utwory pominięte w przebiegu wraz z powodem (D37)
      parameters:
        - { $ref: '#/components/parameters/ExecutionId' }
        - { name: limit, in: query, schema: { type: integer, format: int32, default: 200 } }
      responses:
        '200':
          description: Lista pominięć
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EnrichFailureResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/enrich/jobs/{executionId}/restart:
    post:
      tags: [enrich]
      operationId: restartEnrichJob
      summary: Restart nieudanego wykonania — dokańcza od checkpointu
      parameters: [{ $ref: '#/components/parameters/ExecutionId' }]
      responses:
        '202':
          description: Nowe wykonanie wystartowało
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionIdResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/enrich/missing-count:
    get:
      tags: [enrich]
      operationId: getMissingCount
      summary: Braki per grupa pól
      responses:
        '200':
          description: Liczniki braków
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MissingFieldsCount' }

  /api/ingest/file:
    post:
      tags: [ingest]
      operationId: ingestFile
      summary: Import utworów z pliku CSV
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Raport importu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestFileResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/ingest/metrics:
    post:
      tags: [ingest]
      operationId: ingestMetrics
      summary: Import metryk z jednego lub wielu plików (D24)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: array
                  items: { type: string, format: binary }
      responses:
        '200':
          description: Raport per plik
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestMetricsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/ingest/playlist:
    post:
      tags: [ingest]
      operationId: ingestPlaylist
      summary: Import playlisty ze Spotify spod linku
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestPlaylistRequest' }
      responses:
        '200':
          description: Raport importu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestPlaylistResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/ExternalServiceError' }

  /api/ingest/my-playlists:
    post:
      tags: [ingest]
      operationId: ingestMyPlaylists
      summary: Import wszystkich playlist połączonego konta
      description: Awaria pojedynczej playlisty nie przerywa przebiegu.
      responses:
        '200':
          description: Raport zbiorczy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestMyPlaylistsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/ingest/my-playlists/refresh-status:
    get:
      tags: [ingest]
      operationId: getPlaylistRefreshStatus
      summary: Wynik ostatniego cyklicznego odświeżenia playlist
      responses:
        '200':
          description: Status odświeżania
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaylistRefreshStatusResponse' }

  /api/auth/spotify/login:
    get:
      tags: [auth]
      operationId: spotifyLogin
      summary: Przekierowanie do zgody OAuth Spotify
      responses:
        '302':
          description: Przekierowanie na stronę zgody
          headers:
            Location:
              schema: { type: string }

  /api/auth/spotify/callback:
    get:
      tags: [auth]
      operationId: spotifyCallback
      summary: Odbiór kodu autoryzacyjnego
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '200':
          description: Konto połączone
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpotifyAccountResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/auth/spotify/status:
    get:
      tags: [auth]
      operationId: spotifyStatus
      summary: Czy konto Spotify jest połączone
      responses:
        '200':
          description: Stan połączenia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpotifyAccountResponse' }

components:

  parameters:
    SpotifyId:
      name: spotifyId
      in: path
      required: true
      schema: { type: string }
    PlaylistId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    PlaylistIdPath:
      name: playlistId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    BadRequest:
      description: Błąd walidacji
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Zasób nie istnieje
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Konflikt — zasób zmieniony w innym miejscu albo już istnieje
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ExternalServiceError:
      description: Zewnętrzne API odmówiło odpowiedzi
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:

    GenreFamily:
      type: string
      enum: [LATIN, ROCK, POP, DISCO, DISCO_POLO, ELECTRONIC, HIP_HOP, OTHER]

    TempoClass:
      type: string
      enum: [SLOW, MEDIUM, FAST, VERY_FAST]

    BpmSource:
      type: string
      enum: [MANUAL, ACOUSTICBRAINZ, DEEZER, LLM]

    MissingGroup:
      type: string
      enum: [METADATA, AUDIO, AI, ANY]

    CatalogSort:
      type: string
      enum: [RELEVANCE, TITLE, ARTIST, ALBUM, YEAR, BPM, POPULARITY, DURATION,
             DANCEABILITY, ENERGY, RATING, ADDED_AT]

    SortDirection:
      type: string
      enum: [ASC, DESC]

    EnrichmentScope:
      type: string
      enum: [SINGLE, SELECTED, MISSING, OUTDATED]

    FieldGroup:
      type: string
      enum: [METADATA, AUDIO, AI]

    SetCurve:
      type: string
      enum: [STANDARD, WEDDING, CLUB, EVEN]

    DjSlot:
      type: string
      enum: [WARMUP, MIDDLE, PEAK, CLOSING, BREAK]

    LibrarySource:
      type: string
      enum: [FILE, PLAYLIST, FOREIGN_PLAYLIST]

    RefreshOutcome:
      type: string
      description: |
