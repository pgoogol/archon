spring:
  application:
    name: music-service
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      # pełny eksport Exportify (~2500 wierszy) przekracza domyślny 1MB
      max-file-size: 10MB
      # metryki wgrywa się partiami po kilkanaście plików naraz
      max-request-size: 100MB
  batch:
    job:
      # joby startują wyłącznie przez EnrichmentService, nie przy starcie aplikacji
      enabled: false
    jdbc:
      # tabele BATCH_* zarządza Flyway (migracja V3)
      initialize-schema: never

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Warstwa AI: provider, model i wersja promptu wyłącznie tutaj — nigdy w kodzie
llm:
  provider: ${LLM_PROVIDER:openai}   # openai (i zgodne: OpenRouter/Groq/Mistral/lokalne) | anthropic
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:}
  base-url: ${LLM_BASE_URL:}         # puste = domyślny URL providera
  prompt-version: v1
  batch-size: 5
  requests-per-second: 2
  max-tokens: 2048
  temperature: 0.2
  # twardy sufit zlecenia — SELECTED miał limit od M1.6, MISSING nie miał
  # żadnego, a pomyłka w LLM_MODEL przy 2500 utworach to realny rachunek
  max-tracks-per-job: ${LLM_MAX_TRACKS_PER_JOB:500}
  # stawki providera w USD za 1M tokenów; puste = nie znamy cennika i mówimy to
  # wprost zamiast zgadywać (szacunek pokazujemy przed startem joba)
  cost:
    input-per-1m: ${LLM_COST_INPUT_PER_1M:}
    output-per-1m: ${LLM_COST_OUTPUT_PER_1M:}

# Automatyczne odświeżanie własnych playlist ze Spotify. Przebieg jest ten sam
# co ręczny import trybu C, ale pobiera wyłącznie playlisty o zmienionym
# snapshot_id — odświeżenie bez zmian to jedno wywołanie listy playlist.
# Odstęp liczy się od ZAKOŃCZENIA poprzedniego przebiegu (fixedDelay), więc
# przebiegi się nie nakładają.
#
# Raz na dobę wystarcza, bo świeżość i tak zapewnia przycisk „Importuj moje
# playlisty" oraz przebieg po każdym starcie aplikacji. Kwota Web API liczy się
# per konto dewelopera i jest dzielona ze wzbogacaniem katalogu, więc odświeżanie
# w tle ma być tanim tłem, nie głównym konsumentem budżetu. Przy rzadkich zmianach
# playlist spokojnie można ustawić 7d.
ingestion:
  playlist-refresh:
    enabled: ${PLAYLIST_REFRESH_ENABLED:true}
    interval: ${PLAYLIST_REFRESH_INTERVAL:24h}
    # nie zero: dajemy aplikacji wstać, zanim ruszy pierwszy przebieg. Przy odstępie
    # dobowym to ten przebieg jest w praktyce głównym odświeżeniem — narzędzie
    # uruchamia się częściej, niż mija doba
    initial-delay: ${PLAYLIST_REFRESH_INITIAL_DELAY:10s}

clients:
  spotify:
    base-url: https://api.spotify.com
    auth-url: https://accounts.spotify.com
    client-id: ${SPOTIFY_CLIENT_ID:}
    client-secret: ${SPOTIFY_CLIENT_SECRET:}
    # limit chwilowy; kwota dobowa to osobne ograniczenie i pilnuje jej bramka
    # w SpotifyApiExecutor — po jej wyczerpaniu ruch wstrzymuje się sam
    requests-per-second: 3
    # OAuth PKCE — adres musi być identyczny z wpisanym w dashboardzie Spotify
    redirect-uri: ${SPOTIFY_REDIRECT_URI:http://127.0.0.1:8080/music/api/v1/auth/spotify/callback}
    scopes: playlist-read-private playlist-read-collaborative playlist-modify-private playlist-modify-public
  musicbrainz:
    # twardy limit 1 req/s jest w kodzie klienta — celowo nie w konfiguracji
    base-url: https://musicbrainz.org
    user-agent: ${MB_USER_AGENT:}
  deezer:
    base-url: https://api.deezer.com
    requests-per-second: 10

# Uwierzytelnianie: token identyfikacyjny Google jako Bearer albo konto lokalne
# jako Basic. Obie drogi obok siebie — konto lokalne pozwala otworzyć aplikację,
# zanim klient Google zostanie skonfigurowany.
#
# Konto spoza listy dozwolonych adresów dostaje 403, a nie 401: token jest
# w porządku, brakuje uprawnień — w logach to widać jako różne zdarzenia.
bearer-auth:
  # identyfikator klienta OAuth z Google Cloud; puste = logowanie tylko kontem lokalnym
  audience: ${GOOGLE_CLIENT_ID:}
  allowed-emails: ${AUTH_ALLOWED_EMAILS:}
  local-account:
    enabled: ${AUTH_LOCAL_ENABLED:true}
    username: ${AUTH_LOCAL_USERNAME:admin}
    # wyłącznie hash BCrypt — hasło jawnym tekstem nigdy nie trafia do konfiguracji;
    # wartość domyślna to hasło `admin`, do podmiany przed wystawieniem publicznie
    password-hash: ${AUTH_LOCAL_PASSWORD_HASH:$2a$12$BvwzPFLCgfGMGbvLuk.S8eag3KABV0PHfzaXdFyvnI9g3pruZuw0q}
  public-paths:
    # sondę zdrowia woła healthcheck kontenera — jej zamknięcie psuje kolejność startu
    - /actuator/health
    # Spotify wywołuje ten adres przeglądarką użytkownika i nie doniesie tokenu;
    # przed podszyciem broni go parametr `state` sprawdzany w kontrolerze
    - /music/api/v1/auth/spotify/callback
