# Profil `local` — praca z Postgresem ze środowiska deweloperskiego:
#   docker compose -f deploy/compose/docker-compose.yml up -d
#
# Baza `kitchen` powstaje ze skryptu deploy/compose/postgres/init — jedna
# instancja Postgresa, osobna baza dla każdego serwisu monorepo. Na środowisku
# postawionym wcześniej trzeba ją dołożyć bez kasowania danych:
#   docker compose -f deploy/compose/docker-compose.yml exec -T postgres \
#     psql -U postgres -c "create database kitchen"
#
# Klucze providerów LLM (import przepisów) czyta się z `.env` w katalogu
# głównym repozytorium — tego samego, który compose podaje kontenerowi. Pierwsza
# ścieżka działa przy uruchomieniu z katalogu modułu (tak startuje
# spring-boot:run i IDE), druga z katalogu głównego. Obie opcjonalne: bez pliku
# aplikacja wstaje na wartościach domyślnych. Zmienna środowiskowa ma
# pierwszeństwo przed wpisem z pliku.
spring:
  config:
    import:
      - optional:file:../../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/kitchen
    username: postgres
    password: qwerty
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
