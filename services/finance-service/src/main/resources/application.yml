spring:
  application:
    name: finance-service
  servlet:
    multipart:
      # wyciąg za rok z konta z ruchem potrafi przekroczyć domyślny 1MB;
      # jeden plik na żądanie, więc limit żądania trzyma się blisko limitu pliku
      max-file-size: 10MB
      max-request-size: 12MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # encje nie noszą nazwy schematu w adnotacjach — trzyma ją konfiguracja,
        # jedno miejsce zamiast powtórki przy każdej tabeli
        default_schema: finance
  flyway:
    # schemat zakłada Flyway; tam też ląduje jego tabela historii
    schemas: finance
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      max-lifetime: 1800000
      leak-detection-threshold: 5000

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

finance:
  # Waluta bazowa całego modułu: w niej liczą się wszystkie zestawienia zbiorcze.
  # Zmiana po wprowadzeniu danych wymaga przeliczenia base_amount_minor każdej
  # transakcji, więc traktuj ją jak decyzję jednorazową.
  base-currency: PLN

clients:
  nbp:
    base-url: https://api.nbp.pl
    # NBP nie publikuje twardego limitu; trzymamy się wartości, która nie
    # obciąża publicznego API przy synchronizacji wielu walut naraz
    requests-per-second: 5
    # tabela A — kursy średnie walut wymienialnych
    table: a

# Uwierzytelnianie: token identyfikacyjny Google jako Bearer albo konto lokalne
# jako Basic. Obie drogi obok siebie — konto lokalne pozwala otworzyć aplikację,
# zanim klient Google zostanie skonfigurowany.
#
# Konto spoza listy dozwolonych adresów dostaje 403, a nie 401: token jest
# w porządku, brakuje uprawnień — w logach to widać jako różne zdarzenia.
bearer-auth:
  # identyfikator klienta OAuth z Google Cloud; puste = logowanie tylko kontem lokalnym
  audience: ${GOOGLE_CLIENT_ID:}
  allowed-emails: ${AUTH_ALLOWED_EMAILS:}
  local-account:
    enabled: ${AUTH_LOCAL_ENABLED:true}
    username: ${AUTH_LOCAL_USERNAME:admin}
    # wyłącznie hash BCrypt — hasło jawnym tekstem nigdy nie trafia do konfiguracji;
    # wartość domyślna to hasło `admin`, do podmiany przed wystawieniem publicznie
    password-hash: ${AUTH_LOCAL_PASSWORD_HASH:$2a$12$BvwzPFLCgfGMGbvLuk.S8eag3KABV0PHfzaXdFyvnI9g3pruZuw0q}
  public-paths:
    # sondę zdrowia woła healthcheck kontenera — jej zamknięcie psuje kolejność startu
    - /actuator/health
