memory.note=„Zajęte po sprzątaniu” to najwięcej pamięci zajętej tuż po sprzątaniu, czyli\n\
górna granica tego, co testy naprawdę trzymają. Poniżej 70% limitu jest\n\
wygodnie, 70-85% robi się ciasno, powyżej 85% grozi awarią\n\
(OutOfMemoryError). „Najwyższe użycie” jest naturalnie wyższe: Java zużywa\n\
wolną pamięć, zanim posprząta. Pełne sprzątanie zatrzymuje wszystko; najlepiej 0.

