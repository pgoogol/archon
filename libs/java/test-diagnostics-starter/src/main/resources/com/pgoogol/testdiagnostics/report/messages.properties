# Teksty raportu po angielsku; plik bazowy, używany także dla nieobsługiwanych języków.
# Kopia po polsku: messages_pl.properties, z tym samym zbiorem kluczy (pilnuje test).
# Wzorce idą przez String.format: procent zapisuje się jako %%. Klucze *.note
# są objaśnieniami bez formatowania, a \n dzieli je na linie raportu.

header.title=TEST REPORT: %s
label.tests=tests
label.unit=unit tests
label.integration=integration tests
more=... and %d more

section.result=RESULT
result.verdict=Verdict
result.verdict.passed=ALL TESTS PASSED
result.verdict.problems=PROBLEMS FOUND: %d - see FAILED TESTS below
result.tests=Tests run
result.tests.value=%d  (passed %d, failed %d, skipped %d)
result.classes=Test classes
result.total=Total time
result.package=Package shown below

section.time=WHERE THE TIME WENT
time.environments=Starting test environments
time.resumes=Resuming paused environments
time.tests=Running the tests
time.other=Other (class setup/cleanup)
time.note=A test environment is a full copy of the application started for testing.\n\
Tests with identical configuration share one environment, so fewer\n\
environments mean a faster and lighter build.

section.environments=TEST ENVIRONMENTS
environments.none=No application environment was started in this part (plain tests only).
environments.summary=New environments started: %d, total start time: %s
environments.column.start=Start time
environments.column.class=Started for test class
environments.column.profiles=Profiles
environments.column.beans=Beans
environments.failed=FAILED
environments.note=The first environment is usually the slowest, because Java is still warming up.
environments.resumed=Paused environments resumed: %d, total time: %s
environments.resumed.note=Spring pauses environments that are not in use and restarts their components\n\
(schedulers, web server, message listeners) when a test needs them again.

section.classes=SLOWEST TEST CLASSES (top %d)
classes.column.total=Total
classes.column.environment=Env start
classes.column.tests=Tests
classes.column.count=Count
classes.column.class=Class
classes.column.hint=What it means
hint.environment=starts a test environment
hint.slowTests=tests are slow - check for waiting/timeouts
hint.setup=slow class setup or cleanup

section.tests=SLOWEST SINGLE TESTS (top %d, longer than 1 s)
tests.none=No single test took longer than 1 second.
tests.note=A single test taking several seconds usually waits for something\n\
(sleep, timeout, retry). Shortening that wait in test settings speeds it up.

section.failures=FAILED TESTS (%d)
failures.wholeClass=(whole class)

section.memory=MEMORY
memory.limit=Memory limit for tests
memory.limit.value=%d MB
memory.peak=Highest use (approx.)
memory.peak.value=%d MB (%d%% of limit)
memory.kept=Kept after cleanup (peak)
memory.kept.value=%d MB (%d%% of limit)   %s
memory.nonHeap=Extra memory outside limit
memory.nonHeap.value=%d MB (program code and classes)
memory.gc=Time spent cleaning memory
memory.gc.value=%s (%d%% of run)   %s
memory.fullGc=Full memory cleanups
memory.fullGc.value=%d   %s
memory.note='Kept after cleanup' is the most memory still in use right after a cleanup,\n\
an upper bound of what the tests really keep. Below 70% of the limit is\n\
comfortable, 70-85% is getting tight, above 85% risks a crash\n\
(OutOfMemoryError). 'Highest use' is naturally higher: Java uses free\n\
memory before cleaning up. Full cleanups pause everything; ideally 0.

cause.label=reason
cause.first=first environment in this run
cause.reloaded.dirtied=same configuration as #%d, closed by @DirtiesContext after %s
cause.reloaded.evicted=same configuration as #%d, evicted from the context cache (spring.test.context.cache.maxSize)
cause.differs=differs from #%d in:
cause.unknown=unknown, the configuration could not be read (%s)

section.causes=MOST COMMON REASONS FOR NEW ENVIRONMENTS
causes.note=Each new environment is a full application start. Tests that differ only in\n\
a mock or a property can often share one configuration, e.g. a common base class.
summary.dirtied=closed by @DirtiesContext
summary.evicted=evicted from the context cache
summary.unknown=reason unknown

