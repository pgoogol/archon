# CI monorepo archon. Każdy job odpowiada jednej kolumnie z tabeli egzekutorów
# w .claude/rules/backend.md i frontend.md — reguła bez kroku, który ją sprawdza,
# jest tylko prośbą.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'

jobs:

  java:
    name: Java — verify z testami integracyjnymi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Testcontainers startuje własnego Postgresa 16 — runner ma Dockera,
      # więc nie podstawiamy tu bazy przez TEST_POSTGRES_CONTAINER.
      # `verify` odpala też Spotless, enforcer, ArchUnit, test kontraktowy
      # i bramkę pokrycia JaCoCo.
      - name: mvnw verify
        run: ./mvnw -T 1C -B --no-transfer-progress verify

      # ścieżka obejmuje każdy serwis, żeby dołożenie kolejnego nie wymagało
      # pamiętania o tym kroku
      - name: Raport pokrycia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: services/*/target/site/jacoco/
          if-no-files-found: ignore

  front:
    name: Front — lint, typy, testy, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # granice modułów są tu błędem, nie ostrzeżeniem
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  kontrola:
    name: Kontrola reguł
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks skanuje historię, nie tylko czubek gałęzi
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # ── zero <version> w POM-ach modułów ────────────────────────────────
      # Wersje należą do root pom.xml. <version> w bloku <parent> jest
      # oczywiście dozwolony i tylko on — dlatego wycinamy go przed sprawdzeniem.
      - name: POM-y modułów bez wersji
        run: |
          status=0
          for pom in $(find . -name pom.xml -not -path './pom.xml' -not -path '*/target/*'); do
            found=$(sed '/<parent>/,/<\/parent>/d' "$pom" | grep -c '<version>' || true)
            if [ "$found" -ne 0 ]; then
              echo "::error file=$pom::$found <version> poza blokiem <parent> — wersje należą do root pom.xml"
              status=1
            fi
          done
          exit $status

      # ── reguły PL są wierną kopią EN ────────────────────────────────────
      - name: Drzewa reguł EN i PL zgodne
        run: |
          status=0
          if ! diff <(ls .claude/rules | sort) <(ls docs/rules-pl | sort) > /tmp/rules.diff; then
            echo "::error::lista plików reguł różni się między .claude/rules a docs/rules-pl"
            cat /tmp/rules.diff
            status=1
          fi
          for f in $(ls .claude/rules); do
            [ -f "docs/rules-pl/$f" ] || continue
            en=$(grep -c '^## ' ".claude/rules/$f" || true)
            pl=$(grep -c '^## ' "docs/rules-pl/$f" || true)
            if [ "$en" != "$pl" ]; then
              echo "::error file=docs/rules-pl/$f::sekcji EN=$en PL=$pl — kopia rozjechała się z oryginałem"
              status=1
            fi
          done
          exit $status

      # ── typy DTO zgodne z kontraktem ────────────────────────────────────
      - run: pnpm install --frozen-lockfile
      - name: Typy z kontraktu są aktualne
        run: |
          pnpm --filter @archon/api-client generate
          if ! git diff --exit-code -- libs/ts/api-client/src; then
            echo "::error::wygenerowane typy różnią się od zapisanych — uruchom pnpm --filter @archon/api-client generate"
            exit 1
          fi

      # ── żadnych sekretów w repo ─────────────────────────────────────────
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: E2E — front i serwis jako dwie aplikacje
    runs-on: ubuntu-latest
    needs: [java, front]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: music
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qwerty
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d music"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # E2E potrzebuje ARTEFAKTÓW, nie testów — te przeszły już w jobach wyżej
      - run: ./mvnw -B --no-transfer-progress -pl services/music-service -am -DskipTests package
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build

      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: pnpm --filter e2e test
        env:
          CI: 'true'

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore
