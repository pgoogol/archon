# Opis, profile i komendy: URUCHAMIANIE.md

name: archon

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qwerty
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  music-service:
    profiles: ["music", "services", "full"]
    build:
      context: ../..
      dockerfile: services/music-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ../../.env
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/music
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: qwerty
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  finance-service:
    profiles: ["finance", "services", "full"]
    build:
      context: ../..
      dockerfile: services/finance-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/finance
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: qwerty
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  kitchen-service:
    profiles: ["kitchen", "services", "full"]
    build:
      context: ../..
      dockerfile: services/kitchen-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ../../.env
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kitchen
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: qwerty
    ports:
      - "8082:8082"
    volumes:
      # oryginały importu i zdjęcia dań przeżywają restart kontenera
      - kitchen-media:/var/lib/kitchen/media
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    profiles: ["web", "full"]
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    depends_on:
      music-service:
        condition: service_healthy
        required: false
      finance-service:
        condition: service_healthy
        required: false
      kitchen-service:
        condition: service_healthy
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MUSIC_API_HOST: music-service
      MUSIC_API_PORT: "8080"
      FINANCE_API_HOST: finance-service
      FINANCE_API_PORT: "8081"
      KITCHEN_API_HOST: kitchen-service
      KITCHEN_API_PORT: "8082"
    ports:
      - "5173:80"

volumes:
  postgres-data:
  kitchen-media:
